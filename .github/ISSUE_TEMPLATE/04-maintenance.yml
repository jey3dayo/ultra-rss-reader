name: Maintenance Task
description: chore、運用整理、release prep、non-feature task を起票する
title: "chore: "
labels: ["chore"]
body:
  - type: markdown
    attributes:
      value: |
        この form は `chore` 系 issue のベースです。
        `dependencies`, `docs`, `ci`, `i18n` などの領域ラベルは `.github/labeler.yml` の自動付与を source of truth にします。
        `size/*`, `risk/*` は PR insights と maintainer 確認を source of truth にします。
        `release-readiness` は release 設定変更では `.github/labeler.yml` が付与し、それ以外の release 準備 issue は起票後に maintainer が補完します。
        `manual-verification`, `product` などの運用ラベルは、起票後に maintainer が補完します。
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: 何を整理・確認・改善したいか
      placeholder: |
        production 用 bundle identifier 変更後の互換性影響を確認する。
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: Background
      description: 背景、今の状態、なぜ必要か
      placeholder: |
        identifier 変更はデータ保存先や OS 側の認識に影響する可能性があるため、v1.0 前に確認しておきたい。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: 予定している確認項目や作業内容
      placeholder: |
        - Keychain / app_data_dir / updater の互換性確認
        - 既存環境からの移行影響確認
        - 必要なら release note 反映
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-Goals
      description: 今回やらないこと
    validations:
      required: false
  - type: checkboxes
    id: areas
    attributes:
      label: Affected Areas
      options:
        - label: リリース運用
        - label: Product / go-to-market
        - label: フロントエンド (React / TypeScript)
        - label: バックエンド (Rust / Tauri)
        - label: UI / Storybook
        - label: テスト
        - label: dependencies
        - label: CI/CD
        - label: ワークフロー / 設定 (GitHub Actions / mise / tooling)
        - label: ドキュメント
        - label: i18n / ローカライズ
        - label: 実機確認
  - type: checkboxes
    id: follow-up-labels
    attributes:
      label: Likely Follow-Up Labels
      description: maintainer が後で付けるべきラベルの目安
      options:
        - label: manual-verification が必要
        - label: release-readiness に入る
        - label: product に入る
        - label: dependencies に入る
        - label: docs に入る
        - label: ci に入る
  - type: textarea
    id: done-when
    attributes:
      label: Done When
      description: PR DoD 共通 gate、maintenance 固有 gate、manual verification gate を分けて完了条件を書いてください
      placeholder: |
        - [ ] PR DoD 共通 gate（型・lint・test・format）が通っている
        - [ ] 必要な確認項目を消化した
        - [ ] 影響有無を記録した
        - [ ] follow-up が必要なら別 issue や release note に落とした
        - [ ] PR 作成時は PR template の確認済み DoD を満たす
    validations:
      required: true
  - type: checkboxes
    id: quality-gate
    attributes:
      label: Quality Gate
      description: >-
        PR 作成時は PR template の確認済み DoD と同じ gate を満たしてください。
        DOM/CI/focused test は `mise run test:unit:dom` / `mise run ci` / focused test の確認を指します。
      options:
        - label: 型エラー 0 件 (`mise run check` の `lint:types`)
          required: true
        - label: リント違反 0 件 (`mise run check` の `lint`)
          required: true
        - label: 高速テスト成功 (`mise run check` の `test:unit:fast` / `test:rust`)
          required: true
        - label: フォーマッター適用済み (`mise run check` の `format`)
          required: true
        - label: jsdom / DOM / React rendering / PR handoff / release / native / Storybook 影響時は DOM/CI/focused test を記録
          required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: 関連 issue、TODO、docs、外部リンクなど
    validations:
      required: false
