name: Bug Report
description: 不具合、回帰、hardening、failure-path 改善を起票する
title: "fix: "
labels: ["fix"]
body:
  - type: markdown
    attributes:
      value: |
        既存 issue と重複していないか先に確認してください。

        この form は `fix` 系 issue のベースです。
        `frontend`, `backend`, `docs`, `ci`, `dependencies`, `i18n` などの領域ラベルは `.github/labeler.yml` の自動付与を source of truth にします。
        `size/*`, `risk/*` は PR insights と maintainer 確認を source of truth にします。
        `category/tests`, `manual-verification`, `release-readiness` などの運用ラベルは、起票後に maintainer が補完します。
  - type: textarea
    id: current-behavior
    attributes:
      label: Current Behavior
      description: 今起きている問題を簡潔に書いてください
      placeholder: |
        Windows のファイルロックや backup/restore 失敗時に、DB migration recovery の挙動が脆い可能性がある。
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: 本来どうあるべきか
      placeholder: |
        restore は fail-fast を維持し、部分復旧状態で処理が継続しないこと。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction / Failure Path
      description: 再現手順、失敗シナリオ、テストで再現したい観点
      placeholder: |
        1. Windows file lock を想定した失敗注入を行う
        2. backup/restore failure を発生させる
        3. recovery path のログと継続条件を確認する
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: 影響範囲や想定リスク
      placeholder: |
        migration recovery はユーザーデータに直結するため、失敗時の導線が sharp edge になりやすい。
    validations:
      required: true
  - type: checkboxes
    id: areas
    attributes:
      label: Affected Areas
      options:
        - label: フロントエンド (React / TypeScript)
        - label: バックエンド (Rust / Tauri)
        - label: データベース
        - label: API連携 / provider
        - label: テスト
        - label: ドキュメント
        - label: ワークフロー / 設定 (GitHub Actions / mise / tooling)
        - label: 依存関係
        - label: i18n / ローカライズ
  - type: checkboxes
    id: follow-up-labels
    attributes:
      label: Likely Follow-Up Labels
      description: maintainer が後で付けるべきラベルの目安
      options:
        - label: category/tests が必要
        - label: risk/high 相当
        - label: manual-verification が必要
        - label: release-readiness に入る
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Evidence
      description: ログ、エラーメッセージ、関連コード、参考資料
      render: shell
    validations:
      required: false
  - type: textarea
    id: done-when
    attributes:
      label: Done When
      description: PR DoD 共通 gate、bug 固有 gate、manual verification gate を分けて完了条件を書いてください
      placeholder: |
        - [ ] PR DoD 共通 gate（型・lint・test・format）が通っている
        - [ ] 問題が再現しなくなる
        - [ ] 関連 failure-path tests が追加または更新されている
        - [ ] 必要な recovery guidance が整理されている
        - [ ] PR 作成時は PR template の確認済み DoD を満たす
    validations:
      required: true
