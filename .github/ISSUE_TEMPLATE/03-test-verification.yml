name: Test / Verification Task
description: 手動検証、release readiness、テスト観点整理の task を起票する
title: "test: "
labels: ["category/tests"]
body:
  - type: markdown
    attributes:
      value: |
        この form は `test` / verification 系 issue のベースです。
        `docs`, `ci`, `frontend`, `backend` などの領域ラベルは `.github/labeler.yml` の自動付与を source of truth にします。
        `size/*`, `risk/*` は PR insights と maintainer 確認を source of truth にします。
        `release-readiness` は release 設定変更では `.github/labeler.yml` が付与し、それ以外の release 準備 issue は起票後に maintainer が補完します。
        `manual-verification` などの運用ラベルは、起票後に maintainer が補完します。
  - type: textarea
    id: background
    attributes:
      label: Background
      description: なぜ今この検証が必要か
      placeholder: |
        自動アップデート失敗シナリオは CI だけでは確認しづらく、リリース前に実機で代表ケースを確認したい。
    validations:
      required: true
  - type: textarea
    id: scenarios
    attributes:
      label: Verification Scenarios
      description: 確認したい観点をチェックリストや箇条書きで書いてください
      placeholder: |
        - [ ] 署名不一致
        - [ ] ネットワーク切断
        - [ ] ダウンロード破損
        - [ ] endpoint 404 / 5xx
    validations:
      required: true
  - type: textarea
    id: prerequisites
    attributes:
      label: Preconditions
      description: 前提条件、必要な環境、必要な配布物
      placeholder: |
        - 署名付きリリース資産
        - 実機テスト環境
        - 手順書または再現用セットアップ
    validations:
      required: true
  - type: checkboxes
    id: areas
    attributes:
      label: Affected Areas
      options:
        - label: フロントエンド (React / TypeScript)
        - label: バックエンド (Rust / Tauri)
        - label: UI / Storybook
        - label: テスト
        - label: updater / release flow
        - label: CI/CD
        - label: ワークフロー / 設定 (GitHub Actions / mise / tooling)
        - label: ドキュメント
        - label: 依存関係
        - label: i18n / ローカライズ
  - type: checkboxes
    id: follow-up-labels
    attributes:
      label: Likely Follow-Up Labels
      description: maintainer が後で付けるべきラベルの目安
      options:
        - label: manual-verification が必要
        - label: release-readiness に入る
        - label: risk/high 相当
  - type: textarea
    id: done-when
    attributes:
      label: Done When
      description: PR DoD 共通 gate、verification 固有 gate、manual verification gate を分けて完了条件を書いてください
      placeholder: |
        - [ ] PR DoD 共通 gate（型・lint・test・format）が通っている
        - [ ] 各シナリオの挙動を確認した
        - [ ] リカバリ方法や注意点を記録した
        - [ ] 必要なら release note / docs へ反映した
        - [ ] PR 作成時は PR template の確認済み DoD を満たす
    validations:
      required: true
  - type: checkboxes
    id: quality-gate
    attributes:
      label: Quality Gate
      description: PR 作成時は PR template の確認済み DoD と同じ gate を満たしてください
      options:
        - label: 型エラー 0 件 (`mise run check` の `lint:types`)
          required: true
        - label: リント違反 0 件 (`mise run check` の `lint`)
          required: true
        - label: 全テスト成功 (`mise run check` の `test`)
          required: true
        - label: フォーマッター適用済み (`mise run check` の `format`)
          required: true
        - label: release / native / Storybook / manual verification / release readiness 影響時は `mise run ci` または focused test を確認内容へ記録
          required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: 関連 issue、TODO、docs など
    validations:
      required: false
