name: Start Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Stable release tag, for example v0.65.0"
        required: true
        type: string
      expected_sha:
        description: "Exact 40-character main commit SHA with successful CI"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-start
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Validate invocation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const { RELEASE_TAG = "", EXPECTED_SHA = "", GITHUB_REF, GITHUB_SHA } = process.env;
          if (RELEASE_TAG !== RELEASE_TAG.trim() || !/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(RELEASE_TAG)) {
            throw new Error("release_tag must be a stable vX.Y.Z tag without leading zeroes");
          }
          if (EXPECTED_SHA !== EXPECTED_SHA.trim() || !/^[0-9a-f]{40}$/.test(EXPECTED_SHA)) {
            throw new Error("expected_sha must be a lowercase 40-character commit SHA");
          }
          if (GITHUB_REF !== "refs/heads/main" || GITHUB_SHA !== EXPECTED_SHA) {
            throw new Error("Dispatch from main at exactly expected_sha");
          }
          NODE

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Create draft and dispatch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ./scripts/release/start-release.ts
