# Manual pre-flight for the opt-in Linux matrix entry in release.yml. Run it
# from the Actions tab before flipping `build_linux: true` on a real release,
# so a Linux packaging break surfaces here instead of mid-release. It
# reproduces, from the `release` job in release.yml:
#   - checkout + mise-action + pnpm/setup + rust-toolchain + rust-cache setup
#   - the "Install Linux build dependencies" apt package list
#   - `pnpm install --frozen-lockfile`
#   - the tauri-action build args used for the Linux matrix entry:
#     `--config src-tauri/tauri.release.conf.json --bundles deb,appimage
#     --config src-tauri/tauri.linux.release.conf.json --ci`
# It intentionally skips signing, draft release creation, and asset upload.
#
# Nothing triggers this automatically and release.yml does not depend on it,
# so it only stays useful while it mirrors release.yml's Linux steps. Update
# it whenever those change; a copy that has silently drifted is worse than no
# copy, because a green run here would no longer predict a green release.
# Last confirmed in sync: 2026-08-17 @ 7bbfa70e (run 32012252816).
name: Linux Build Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1.0.0
        with:
          runtime: node@26.4.0
          cache: true
          install: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # v1 line: toolchain input is required
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: linux-build-check-${{ hashFiles('src-tauri/Cargo.lock') }}
          save-if: false

      - run: pnpm install --frozen-lockfile

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        with:
          args: >-
            --config src-tauri/tauri.release.conf.json
            --bundles deb,appimage
            --config src-tauri/tauri.linux.release.conf.json
            --ci

      - name: Verify Linux bundle artifacts were produced
        shell: bash
        run: |
          set -euo pipefail

          deb_count=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' 2>/dev/null | wc -l)
          appimage_count=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' 2>/dev/null | wc -l)

          if [[ "$deb_count" -lt 1 ]]; then
            echo "::error::no .deb bundle found under src-tauri/target/release/bundle/deb"
            exit 1
          fi
          if [[ "$appimage_count" -lt 1 ]]; then
            echo "::error::no .AppImage bundle found under src-tauri/target/release/bundle/appimage"
            exit 1
          fi

          echo "::notice::found $deb_count .deb and $appimage_count .AppImage artifact(s)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-build-check-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 3
          if-no-files-found: error
