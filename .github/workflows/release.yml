name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish. Must start with v."
        required: true
        type: string
      dry_run:
        description: "Validate release preflight without building or publishing artifacts."
        required: false
        default: false
        type: boolean
      reuse_existing_assets:
        description: "Validate an existing draft release without rebuilding or uploading assets."
        required: false
        default: false
        type: boolean
      build_linux:
        description: "Build optional Linux .deb and AppImage artifacts."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      should_publish: ${{ steps.signing-preflight.outputs.should_publish }}
      should_build: ${{ steps.signing-preflight.outputs.should_build }}
      release_matrix: ${{ steps.resolve-release-matrix.outputs.matrix }}

    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref }}

      # jdx/mise-action@v4.0.1
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151

      - name: Validate release source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
          REUSE_EXISTING_ASSETS: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_existing_assets || false }}
        run: node ./scripts/release/validate-source.ts

      # pnpm/setup@v1
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879
        with:
          runtime: node@26.4.0
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - name: Validate release version parity
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: node ./scripts/release/validate-version-parity.ts

      - name: Validate release signing preflight
        id: signing-preflight
        shell: bash
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          REUSE_EXISTING_ASSETS: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_existing_assets || false }}
          TAURI_SIGNING_PRIVATE_KEY_SET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD_SET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
        run: |
          set -euo pipefail

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            notice="release dry run validated source, versions, cache, and signing preflight; artifact build and draft release upload are skipped"
            echo "::notice::$notice"
            exit 0
          fi

          if [[ "$REUSE_EXISTING_ASSETS" == "true" ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            notice="release recovery will validate existing draft assets without rebuilding or uploading artifacts"
            echo "::notice::$notice"
            exit 0
          fi

          missing=()
          if [[ "$TAURI_SIGNING_PRIVATE_KEY_SET" != "true" ]]; then
            missing+=("TAURI_SIGNING_PRIVATE_KEY")
          fi
          if [[ "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD_SET" != "true" ]]; then
            missing+=("TAURI_SIGNING_PRIVATE_KEY_PASSWORD")
          fi
          if (( ${#missing[@]} > 0 )); then
            error="release signing secrets are required before artifact build or draft release upload"
            printf '::error::%s: %s\n' "$error" "$(IFS=,; echo "${missing[*]}")"
            echo "::error::rerun workflow_dispatch with dry_run=true to validate release preflight without publishing artifacts"
            exit 1
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "should_build=true" >> "$GITHUB_OUTPUT"

      # Linux packaging is opt-in because it is not in the current user rollout.
      # Last successful verification: 2026-08-17 @ 7bbfa70e, via the linux-build-check workflow
      # (run 32012252816), which builds this same matrix entry without releasing. It produced
      # 1 .deb and 1 .AppImage. Re-verify there before flipping build_linux=true on a real release.
      # Existing entries remain platform: macos-latest / args: --target aarch64-apple-darwin and platform: windows-latest / args: "".
      - name: Resolve release build matrix
        id: resolve-release-matrix
        shell: bash
        env:
          BUILD_LINUX: ${{ github.event_name == 'workflow_dispatch' && inputs.build_linux || false }}
        run: |
          set -euo pipefail

          matrix='{"include":[{"platform":"macos-latest","artifact_platform":"darwin","artifact_arch":"aarch64","updater_platform":"darwin-aarch64","updater_asset_pattern":".app.tar.gz","updater_signature_pattern":".app.tar.gz.sig","updater_enabled":true,"cargo_target":"aarch64-apple-darwin","args":"--target aarch64-apple-darwin"},{"platform":"windows-latest","artifact_platform":"windows","artifact_arch":"x86_64","updater_platform":"windows-x86_64","updater_asset_pattern":"-setup.exe","updater_signature_pattern":"-setup.exe.sig","updater_enabled":true,"cargo_target":"x86_64-pc-windows-msvc","args":""}'
          if [[ "$BUILD_LINUX" == "true" ]]; then
            matrix+=',{"platform":"ubuntu-24.04","artifact_platform":"linux","artifact_arch":"x86_64","updater_platform":"linux-x86_64","updater_asset_pattern":".AppImage","updater_signature_pattern":".AppImage.sig","updater_enabled":false,"cargo_target":"x86_64-unknown-linux-gnu","args":"--bundles deb,appimage --config src-tauri/tauri.linux.release.conf.json"}'
          fi
          matrix+=']}'
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  quality:
    needs: preflight
    if: needs.preflight.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref }}

      # jdx/mise-action@v4.0.1
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151

      # pnpm/setup@v1
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879
        with:
          runtime: node@26.4.0
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - name: Run release quality preflight
        shell: bash
        run: |
          mise run format:check
          mise run lint:types
          mise run test:unit:ci

  release:
    needs: [preflight, quality]
    if: >-
      needs.preflight.outputs.should_publish == 'true' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.release_matrix) }}

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref }}

      # jdx/mise-action@v4.0.1
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151

      - name: Validate release source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
          REUSE_EXISTING_ASSETS: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_existing_assets || false }}
        run: node ./scripts/release/validate-source.ts

      # pnpm/setup@v1
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879
        with:
          runtime: node@26.4.0
          cache: true
          install: false

      # dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || '' }}

      # Swatinem/rust-cache@v2.9.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: src-tauri
          shared-key: release-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          save-if: ${{ github.event_name == 'push' }}

      - run: pnpm install --frozen-lockfile

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Validate release version parity
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: node ./scripts/release/validate-version-parity.ts

      - name: Validate release signing preflight
        id: signing-preflight
        shell: bash
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          REUSE_EXISTING_ASSETS: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_existing_assets || false }}
          TAURI_SIGNING_PRIVATE_KEY_SET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD_SET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
        run: |
          set -euo pipefail

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            notice="release dry run validated source, versions, cache, and signing preflight; artifact build and draft release upload are skipped"
            echo "::notice::$notice"
            exit 0
          fi

          if [[ "$REUSE_EXISTING_ASSETS" == "true" ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            notice="release recovery will validate existing draft assets without rebuilding or uploading artifacts"
            echo "::notice::$notice"
            exit 0
          fi

          missing=()
          if [[ "$TAURI_SIGNING_PRIVATE_KEY_SET" != "true" ]]; then
            missing+=("TAURI_SIGNING_PRIVATE_KEY")
          fi
          if [[ "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD_SET" != "true" ]]; then
            missing+=("TAURI_SIGNING_PRIVATE_KEY_PASSWORD")
          fi
          if (( ${#missing[@]} > 0 )); then
            error="release signing secrets are required before artifact build or draft release upload"
            printf '::error::%s: %s\n' "$error" "$(IFS=,; echo "${missing[*]}")"
            echo "::error::rerun workflow_dispatch with dry_run=true to validate release preflight without publishing artifacts"
            exit 1
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "should_build=true" >> "$GITHUB_OUTPUT"

      - name: Validate release build contamination contract
        if: steps.signing-preflight.outputs.should_build == 'true'
        shell: bash
        run: pnpm run check:release-contamination

      - name: Resolve release semver policy
        if: steps.signing-preflight.outputs.should_build == 'true'
        id: release-policy
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          release_version="${RELEASE_TAG#v}"
          prerelease=false
          if [[ "$release_version" == *-* ]]; then
            prerelease=true
          fi

          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "draft=true" >> "$GITHUB_OUTPUT"

      - name: Import Apple signing certificate
        if: steps.signing-preflight.outputs.should_build == 'true' && runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo "::notice::APPLE_CERTIFICATE is not configured; building macOS artifacts with ad-hoc signing"
            exit 0
          fi

          certificate_path="$RUNNER_TEMP/apple-signing-certificate.p12"
          keychain_path="$RUNNER_TEMP/release-signing.keychain-db"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      # tauri-apps/tauri-action@v0.6.2
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        if: steps.signing-preflight.outputs.should_build == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Absent on forks; the Vite config then skips source map emit entirely
          # so a build without it never ships .map files.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          releaseName: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          releaseDraft: ${{ steps.release-policy.outputs.draft }}
          generateReleaseNotes: false
          prerelease: ${{ steps.release-policy.outputs.prerelease }}
          uploadUpdaterJson: ${{ matrix.updater_enabled }}
          uploadUpdaterSignatures: ${{ matrix.updater_enabled }}
          args: >-
            --config src-tauri/tauri.release.conf.json
            ${{ matrix.args }}
            --ci

      - name: Validate macOS app signing
        if: steps.signing-preflight.outputs.should_build == 'true' && runner.os == 'macOS'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node ./scripts/release/artifacts.ts validate-macos-app-signature

      - name: Validate updater manifest asset contract
        if: steps.signing-preflight.outputs.should_build == 'true' && matrix.updater_enabled == true
        shell: bash
        run: node ./scripts/release/artifacts.ts validate-updater-assets

      - name: Generate updater asset checksums
        if: steps.signing-preflight.outputs.should_build == 'true' && matrix.updater_enabled == true
        shell: bash
        run: node ./scripts/release/artifacts.ts generate-updater-checksums

      - name: Generate release dependency provenance
        if: steps.signing-preflight.outputs.should_build == 'true' && matrix.updater_enabled == true
        shell: bash
        env:
          CARGO_LICENSE_TARGET: ${{ matrix.cargo_target }}
        run: |
          mise run report:licenses
          node ./scripts/release/artifacts.ts generate-dependency-provenance

      - name: Generate release provenance record
        if: steps.signing-preflight.outputs.should_build == 'true' && matrix.updater_enabled == true
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: node ./scripts/release/artifacts.ts generate-release-provenance

      - name: Upload updater asset checksums
        if: steps.signing-preflight.outputs.should_build == 'true' && matrix.updater_enabled == true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: node ./scripts/release/artifacts.ts upload-updater-checksums

      - name: Upload release provenance assets
        if: steps.signing-preflight.outputs.should_build == 'true' && matrix.updater_enabled == true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: node ./scripts/release/artifacts.ts upload-release-provenance

      - name: Validate existing draft release assets
        if: steps.signing-preflight.outputs.should_publish == 'true' && steps.signing-preflight.outputs.should_build == 'false' && matrix.updater_enabled == true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: node ./scripts/release/artifacts.ts validate-existing-release-assets
