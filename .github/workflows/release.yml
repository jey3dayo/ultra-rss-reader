name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish. Must start with v."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30

    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: >-
            ${{ github.event_name == 'workflow_dispatch' &&
            format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Validate manual release tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release_tag must match vX.Y.Z, optionally with prerelease or build metadata"
            exit 1
          fi

      - name: Validate release source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag must match vX.Y.Z, optionally with prerelease or build metadata"
            exit 1
          fi

          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$WORKFLOW_REF" != "refs/tags/$RELEASE_TAG" || "$WORKFLOW_REF_NAME" != "$RELEASE_TAG" ]]; then
              echo "::error::tag push ref $WORKFLOW_REF does not match release tag $RELEASE_TAG"
              exit 1
            fi
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$WORKFLOW_REF" == refs/tags/* && "$WORKFLOW_REF_NAME" != "$RELEASE_TAG" ]]; then
              echo "::error::manual dispatch ref $WORKFLOW_REF does not match release tag $RELEASE_TAG"
              exit 1
            fi
          else
            echo "::error::unsupported release event $EVENT_NAME"
            exit 1
          fi

          git fetch --force --tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"

          tag_target_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{}")"
          checkout_sha="$(git rev-parse HEAD)"
          if [[ "$tag_target_sha" != "$checkout_sha" ]]; then
            echo "::error::release tag $RELEASE_TAG points at $tag_target_sha, but checkout is $checkout_sha"
            exit 1
          fi

      # jdx/mise-action@v4.0.1
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: |
          pnpm config set store-dir .pnpm-store
          store_path="$(pnpm store path --silent)"
          mkdir -p "$store_path"
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      # actions/cache@v5.0.5
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

      # dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || '' }}

      # Swatinem/rust-cache@v2.9.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Validate release version parity
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const releaseTag = process.env.RELEASE_TAG;
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const tauriConfig = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
          const cargoToml = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
          const cargoVersion = cargoToml.match(/^version = "([^"]+)"$/m)?.[1];
          const expectedTag = `v${packageJson.version}`;

          const errors = [];
          if (releaseTag !== expectedTag) {
            errors.push(`release tag ${releaseTag} does not match package.json version ${expectedTag}`);
          }
          if (tauriConfig.version !== packageJson.version) {
            errors.push(`src-tauri/tauri.conf.json version ${tauriConfig.version} does not match package.json version ${packageJson.version}`);
          }
          if (cargoVersion !== packageJson.version) {
            errors.push(`src-tauri/Cargo.toml version ${cargoVersion ?? "(missing)"} does not match package.json version ${packageJson.version}`);
          }

          if (errors.length > 0) {
            for (const error of errors) {
              console.error(`::error::${error}`);
            }
            process.exit(1);
          }
          NODE

      - name: Preflight release build
        run: mise run ci

      # tauri-apps/tauri-action@v0.6.2
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          releaseName: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          releaseDraft: true
          generateReleaseNotes: false
          prerelease: false
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json --ci
