name: PR Insights Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label:
    name: Label PR with Insights
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Apply PR Insights Labels
        # Source of truth: PR Insights owns risk/* and size/* labels only.
        uses: jey3dayo/pr-insights-labeler@e9bccb2e8c9ed048d6022d6ae2e5c85eeed80f16
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

          file_size_limit: "100KB"
          file_lines_limit: "500"
          pr_additions_limit: "5000"
          pr_files_limit: "50"

          additional_exclude_patterns: |
            src/generated/**
            src/components/ui/**
            pnpm-lock.yaml
            src-tauri/target/**
            docs/superpowers/plans/**
          language: "ja"
