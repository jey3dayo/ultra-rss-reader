name: PR Insights Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    name: Label PR with Insights
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Apply PR Insights Labels
        # Source of truth: PR Insights owns risk/* and size/* labels only.
        uses: jey3dayo/pr-insights-labeler@3934dcb1a60e4d79e4acd7ffa7daf4e2097ad184 # v1.11.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

          file_size_limit: "100KB"
          file_lines_limit: "500"
          pr_additions_limit: "5000"
          pr_files_limit: "50"

          additional_exclude_patterns: |
            src/generated/**
            src/components/ui/**
            pnpm-lock.yaml
            src-tauri/target/**
            docs/superpowers/plans/**
          language: "ja"
