name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR pushes are cancelled. Every other run gets its own group (run
# id): a shared group would still replace a *pending* main run with the next
# one, so some main commits would never get a result or save main's caches.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TAURI_SYSTEM_DEPS: >-
    libwebkit2gtk-4.1-dev
    libgtk-3-dev
    libayatana-appindicator3-dev
    librsvg2-dev
    patchelf

jobs:
  change-plan:
    name: Change Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      full: ${{ steps.plan.outputs.full }}
      frontend: ${{ steps.plan.outputs.frontend }}
      storybook: ${{ steps.plan.outputs.storybook }}
      native: ${{ steps.plan.outputs.native }}
      credentials: ${{ steps.plan.outputs.credentials }}
      frontend_os: ${{ steps.plan.outputs.frontend_os }}

    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4.3.0
        with:
          install_args: node
          cache_save: false

      - id: plan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/change-plan.ts

  toolchain:
    name: "Check: Toolchain"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6.1.0

      - uses: jdx/mise-action@v4.3.0

      - uses: $/.github/actions/setup-pnpm
        timeout-minutes: 10

      - run: pnpm install --frozen-lockfile

      - run: mise run quality:toolchain

      - run: mise run actions-lock:verify

      - run: mise run quality:react-doctor-pin

      - run: mise run quality:knip

      - run: mise run test:change-plan

      - name: Verify CI image toolchain contract
        shell: bash
        run: node scripts/ci/check-image-toolchain.mjs

  format:
    name: "Check: Format"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6.1.0

      - uses: jdx/mise-action@v4.3.0

      - uses: $/.github/actions/setup-pnpm
        timeout-minutes: 10

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # v1 line: toolchain input is required
        with:
          toolchain: stable
          components: rustfmt

      - run: pnpm install --frozen-lockfile

      - run: mise run format:check

  lint:
    name: "Check: Lint"
    needs: change-plan
    if: needs.change-plan.outputs.frontend == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.change-plan.outputs.frontend_os) }}

    steps:
      - uses: actions/checkout@v6.1.0

      - uses: jdx/mise-action@v4.3.0

      - uses: $/.github/actions/setup-pnpm
        timeout-minutes: 10

      - run: pnpm install --frozen-lockfile

      - name: Run lint
        shell: bash
        run: >-
          bash scripts/ci/run-logged.sh tmp/ci-artifacts/frontend/lint.log mise run lint:types ::: lint:biome ::: lint:md ::: lint:yaml ::: lint:actions ::: lint:actions-shell ::: lint:workflow-pins

      - name: Upload frontend failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-${{ matrix.os }}-lint-log
          path: tmp/ci-artifacts/frontend/lint.log
          if-no-files-found: ignore
          retention-days: 7

  rust-clippy:
    name: "Check: Rust Clippy"
    needs: change-plan
    if: needs.change-plan.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6.1.0

      - name: Install Tauri system dependencies
        if: matrix.os == 'ubuntu-latest'
        uses: $/.github/actions/setup-tauri-linux-deps
        timeout-minutes: 15

      - uses: jdx/mise-action@v4.3.0

      - uses: $/.github/actions/setup-pnpm
        timeout-minutes: 10

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # v1 line: toolchain input is required
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          # PRs restore main's cache but never write their own, keeping the
          # repo under the 10 GB Actions cache limit (each target is 0.3-1.4 GB).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: pnpm install --frozen-lockfile

      - name: Run lint
        timeout-minutes: 35
        shell: bash
        run: bash scripts/ci/run-logged.sh tmp/ci-artifacts/rust/lint.log mise run lint:clippy

      - name: Upload Rust failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rust-${{ matrix.os }}-lint-log
          path: tmp/ci-artifacts/rust/lint.log
          if-no-files-found: ignore
          retention-days: 14

  test-node:
    name: "Check: Test (Node)"
    needs: change-plan
    if: needs.change-plan.outputs.frontend == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.change-plan.outputs.frontend_os) }}

    steps:
      - uses: actions/checkout@v6.1.0

      - uses: jdx/mise-action@v4.3.0

      - uses: $/.github/actions/setup-pnpm
        timeout-minutes: 10

      - run: pnpm install --frozen-lockfile

      - name: Run Vitest tests (node)
        shell: bash
        run: bash scripts/ci/run-logged.sh tmp/ci-artifacts/frontend/test.log mise run test:unit:ci:node

      - name: Upload frontend failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-${{ matrix.os }}-test-log
          path: tmp/ci-artifacts/frontend/test.log
          if-no-files-found: ignore
          retention-days: 7

  test-rust:
    name: "Check: Test (Rust)"
    needs: change-plan
    if: needs.change-plan.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6.1.0

      - name: Install Tauri system dependencies
        if: matrix.os == 'ubuntu-latest'
        uses: $/.github/actions/setup-tauri-linux-deps
        timeout-minutes: 15

      - uses: jdx/mise-action@v4.3.0

      - uses: $/.github/actions/setup-pnpm
        timeout-minutes: 10

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # v1 line: toolchain input is required
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          # PRs restore main's cache but never write their own, keeping the
          # repo under the 10 GB Actions cache limit (each target is 0.3-1.4 GB).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: pnpm install --frozen-lockfile

      - name: Run Rust tests
        shell: bash
        run: bash scripts/ci/run-logged.sh tmp/ci-artifacts/rust/test.log mise run test:rust

      - name: Validate release build contamination contract
        timeout-minutes: 3
        run: pnpm run check:release-contamination

      - name: Upload Rust failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rust-${{ matrix.os }}-test-log
          path: tmp/ci-artifacts/rust/test.log
          if-no-files-found: ignore
          retention-days: 14

  test-jsdom:
    name: "Check: Test (jsdom shard ${{ matrix.shard }})"
    needs: change-plan
    if: needs.change-plan.outputs.frontend == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.change-plan.outputs.frontend_os) }}
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v6.1.0

      - uses: jdx/mise-action@v4.3.0

      - uses: $/.github/actions/setup-pnpm
        timeout-minutes: 10

      - run: pnpm install --frozen-lockfile

      - name: Run Vitest tests (jsdom shard ${{ matrix.shard }}/2)
        shell: bash
        run: bash scripts/ci/run-logged.sh tmp/ci-artifacts/frontend/test.log mise run test:unit:ci:dom:shard${{ matrix.shard }}

      - name: Upload frontend failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-${{ matrix.os }}-jsdom-shard${{ matrix.shard }}-test-log
          path: tmp/ci-artifacts/frontend/test.log
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: "Check: Build"
    needs: change-plan
    if: needs.change-plan.outputs.frontend == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Windows frontend build runs inside native-smoke via tauri.conf.json beforeBuildCommand.
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v6.1.0

      - uses: jdx/mise-action@v4.3.0

      - uses: $/.github/actions/setup-pnpm
        timeout-minutes: 10

      - run: pnpm install --frozen-lockfile

      - name: Run frontend build
        shell: bash
        run: bash scripts/ci/run-logged.sh tmp/ci-artifacts/frontend/build.log mise run build

      - name: Upload frontend failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-${{ matrix.os }}-build-log
          path: tmp/ci-artifacts/frontend/build.log
          if-no-files-found: ignore
          retention-days: 7

  storybook-a11y:
    name: "Check: Storybook Accessibility"
    needs: change-plan
    if: needs.change-plan.outputs.storybook == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6.1.0

      - uses: jdx/mise-action@v4.3.0

      - uses: $/.github/actions/setup-pnpm
        timeout-minutes: 10

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: mise run build:storybook

      - run: mise run test:storybook:a11y

      - name: Upload Storybook accessibility failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: storybook-a11y-diagnostics
          path: |
            test-results/storybook-a11y/
            playwright-report/storybook-a11y/
          if-no-files-found: ignore
          retention-days: 7

  macos-native:
    name: "Check: macOS native (clippy + smoke)"
    needs: change-plan
    if: needs.change-plan.outputs.native == 'true'
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v6.1.0

      - uses: jdx/mise-action@v4.3.0

      - uses: $/.github/actions/setup-pnpm
        timeout-minutes: 10

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # v1 line: toolchain input is required
        with:
          toolchain: stable
          components: clippy

      - name: Repair macOS Rustup bootstrap
        shell: bash
        run: bash scripts/ci/repair-macos-rustup.sh

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: pnpm install --frozen-lockfile

      - name: Run clippy
        timeout-minutes: 45
        shell: bash
        run: bash scripts/ci/run-logged.sh tmp/ci-artifacts/rust/lint.log mise run lint:clippy

      - name: Verify macOS credential session policy with dummy values
        if: needs.change-plan.outputs.credentials == 'true'
        run: mise run test:keychain-session

      - name: Run native smoke debug build
        timeout-minutes: 40
        shell: bash
        run: bash scripts/ci/run-logged.sh tmp/ci-artifacts/native-smoke/debug-build.log mise run app:build:debug

      - name: Upload Rust failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rust-macos-latest-lint-log
          path: tmp/ci-artifacts/rust/lint.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload native smoke failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-smoke-macos-latest-debug-log
          path: tmp/ci-artifacts/native-smoke/debug-build.log
          if-no-files-found: ignore
          retention-days: 21

      - name: Upload native smoke debug build artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-smoke-macos-latest-debug-build-artifacts
          path: |
            src-tauri/target/debug/bundle/
            src-tauri/target/debug/*.exe
            src-tauri/target/debug/ultra-rss-reader
          if-no-files-found: ignore
          retention-days: 21

  native-smoke:
    name: "Check: Native Smoke"
    needs: change-plan
    if: needs.change-plan.outputs.native == 'true'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6.1.0

      - uses: jdx/mise-action@v4.3.0

      - uses: $/.github/actions/setup-pnpm
        timeout-minutes: 10

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # v1 line: toolchain input is required
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          # PRs restore main's cache but never write their own, keeping the
          # repo under the 10 GB Actions cache limit (each target is 0.3-1.4 GB).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: pnpm install --frozen-lockfile

      - name: Run native smoke debug build
        timeout-minutes: 25
        shell: bash
        run: bash scripts/ci/run-logged.sh tmp/ci-artifacts/native-smoke/debug-build.log mise run app:build:debug

      - name: Upload native smoke failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-smoke-windows-latest-debug-log
          path: tmp/ci-artifacts/native-smoke/debug-build.log
          if-no-files-found: ignore
          retention-days: 21

      - name: Upload native smoke debug build artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-smoke-windows-latest-debug-build-artifacts
          path: |
            src-tauri/target/debug/bundle/
            src-tauri/target/debug/*.exe
            src-tauri/target/debug/ultra-rss-reader
          if-no-files-found: ignore
          retention-days: 21

  audit:
    name: "Check: Dependency Audit"
    needs: change-plan
    if: needs.change-plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6.1.0

      - uses: jdx/mise-action@v4.3.0

      - uses: $/.github/actions/setup-pnpm
        timeout-minutes: 10

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # v1 line: toolchain input is required
        with:
          toolchain: stable


      - run: pnpm install --frozen-lockfile

      - name: Install cargo-audit
        # cargo-audit 0.22.2 pinned
        uses: taiki-e/install-action@v2.87.28
        with:
          tool: cargo-audit@0.22.2

      - name: Run npm dependency audit (prod paths)
        run: mise run audit:deps

      - name: Run Rust dependency audit
        run: mise run audit:deps:rust

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [change-plan, toolchain, format, lint, rust-clippy, macos-native, test-node, test-rust, test-jsdom, build, storybook-a11y, native-smoke, audit]
    if: always()

    steps:
      - uses: actions/checkout@v6.1.0
      - uses: jdx/mise-action@v4.3.0
        with:
          install_args: node
          cache_save: false

      - name: Determine overall result
        env:
          CI_PLAN: ${{ needs.change-plan.outputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/quality-gate.ts
