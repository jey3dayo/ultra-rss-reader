name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TAURI_SYSTEM_DEPS: >-
    libwebkit2gtk-4.1-dev
    libgtk-3-dev
    libayatana-appindicator3-dev
    librsvg2-dev
    patchelf

jobs:
  toolchain:
    name: "Check: Toolchain"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151

      # pnpm/setup@v1
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879
        with:
          runtime: node@24
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - run: mise run quality:toolchain

      - name: Verify CI image toolchain contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";

          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          const miseToml = readFileSync("mise.toml", "utf8");
          const expectedNodeMajor = String(packageJson.engines?.node ?? "");
          const expectedPnpm = String(packageJson.engines?.pnpm ?? "");
          const packageManagerPnpm = packageJson.packageManager?.match(/^pnpm@(.+)$/)?.[1] ?? "";
          const miseNode = miseToml.match(/^node = "([^"]+)"$/m)?.[1] ?? "";
          const misePnpm = miseToml.match(/^"npm:pnpm" = "([^"]+)"$/m)?.[1] ?? "";
          const actualNodeMajor = process.versions.node.split(".")[0];
          const actualPnpm = execFileSync("pnpm", ["--version"], { encoding: "utf8" }).trim();
          const failures = [];

          if (expectedNodeMajor !== miseNode) {
            failures.push(`local mise Node version drift: package.json engines.node=${expectedNodeMajor}, mise.toml=${miseNode}`);
          }
          if (expectedPnpm !== packageManagerPnpm || expectedPnpm !== misePnpm) {
            failures.push(`local pnpm version drift: engines.pnpm=${expectedPnpm}, packageManager=${packageManagerPnpm}, mise.toml=${misePnpm}`);
          }
          if (actualNodeMajor !== expectedNodeMajor) {
            failures.push(`CI Node version drift: expected major ${expectedNodeMajor}, got ${process.versions.node}`);
          }
          if (actualPnpm !== expectedPnpm) {
            failures.push(`CI pnpm version drift: expected ${expectedPnpm}, got ${actualPnpm}`);
          }
          if (failures.length > 0) {
            console.error(failures.join("\n"));
            process.exit(1);
          }

          console.log(`CI image toolchain contract ok: node ${process.versions.node}, pnpm ${actualPnpm}`);
          NODE

  format:
    name: "Check: Format"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151

      # pnpm/setup@v1
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879
        with:
          runtime: node@24
          cache: true
          install: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: rustfmt

      - run: pnpm install --frozen-lockfile

      - run: mise run format:check

  lint:
    name: "Check: Lint"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Tauri system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 ${{ env.TAURI_SYSTEM_DEPS }}

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151

      # pnpm/setup@v1
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879
        with:
          runtime: node@24
          cache: true
          install: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: clippy

      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Run lint
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tmp/ci-artifacts/frontend tmp/ci-artifacts/rust
          mise run lint 2>&1 | tee tmp/ci-artifacts/frontend/lint.log
          cp tmp/ci-artifacts/frontend/lint.log tmp/ci-artifacts/rust/lint.log

      - name: Upload frontend failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-${{ matrix.os }}-lint-log
          path: tmp/ci-artifacts/frontend/lint.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Rust failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-${{ matrix.os }}-lint-log
          path: tmp/ci-artifacts/rust/lint.log
          if-no-files-found: ignore
          retention-days: 14

  test:
    name: "Check: Test"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Tauri system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 ${{ env.TAURI_SYSTEM_DEPS }}

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151

      # pnpm/setup@v1
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879
        with:
          runtime: node@24
          cache: true
          install: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tmp/ci-artifacts/frontend tmp/ci-artifacts/rust
          mise run test:ci 2>&1 | tee tmp/ci-artifacts/frontend/test.log
          cp tmp/ci-artifacts/frontend/test.log tmp/ci-artifacts/rust/test.log

      - name: Upload frontend failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-${{ matrix.os }}-test-log
          path: tmp/ci-artifacts/frontend/test.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Rust failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-${{ matrix.os }}-test-log
          path: tmp/ci-artifacts/rust/test.log
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: "Check: Build"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151

      # pnpm/setup@v1
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879
        with:
          runtime: node@24
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - name: Run frontend build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tmp/ci-artifacts/frontend
          mise run build 2>&1 | tee tmp/ci-artifacts/frontend/build.log

      - name: Upload frontend failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-${{ matrix.os }}-build-log
          path: tmp/ci-artifacts/frontend/build.log
          if-no-files-found: ignore
          retention-days: 7

  native-smoke:
    name: "Check: Native Smoke"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151

      # pnpm/setup@v1
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879
        with:
          runtime: node@24
          cache: true
          install: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Repair macOS Rustup bootstrap
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(cargo --version 2>&1 || true)"
          if [[ "$cargo_version" == rustup-init* ]]; then
            rustup_init="$(command -v rustup-init || command -v cargo)"
            "$rustup_init" -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          cargo --version
          rustc --version

      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Run native smoke debug build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tmp/ci-artifacts/native-smoke
          mise run app:build:debug 2>&1 | tee tmp/ci-artifacts/native-smoke/debug-build.log

      - name: Upload native smoke failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-smoke-${{ matrix.os }}-debug-log
          path: tmp/ci-artifacts/native-smoke/debug-build.log
          if-no-files-found: ignore
          retention-days: 21

      - name: Upload native smoke debug build artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-smoke-${{ matrix.os }}-debug-build-artifacts
          path: |
            src-tauri/target/debug/bundle/
            src-tauri/target/debug/*.exe
            src-tauri/target/debug/ultra-rss-reader
          if-no-files-found: ignore
          retention-days: 21

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [toolchain, format, lint, test, build, native-smoke]
    if: always()

    steps:
      - name: Determine overall result
        env:
          FORMAT_RESULT: ${{ needs.format.result }}
          TOOLCHAIN_RESULT: ${{ needs.toolchain.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          NATIVE_SMOKE_RESULT: ${{ needs.native-smoke.result }}
        shell: bash
        run: |
          set -euo pipefail

          failed=0
          report_required_check() {
            local label="$1"
            local result="$2"

            if [ "$result" = "success" ]; then
              echo "- ${label}: success" >> "$GITHUB_STEP_SUMMARY"
              return
            fi

            echo "::error::${label} FAILED (${result})"
            failed=1

            if [ "$result" = "skipped" ] || [ "$result" = "cancelled" ]; then
              echo "- ${label}: ${result} -> failure because every required CI matrix must complete successfully before merge." >> "$GITHUB_STEP_SUMMARY"
              return
            fi

            echo "- ${label}: ${result}" >> "$GITHUB_STEP_SUMMARY"
          }

          echo "## Quality Gate Result Inputs" >> "$GITHUB_STEP_SUMMARY"
          report_required_check "Toolchain" "$TOOLCHAIN_RESULT"
          report_required_check "Format" "$FORMAT_RESULT"
          report_required_check "Lint" "$LINT_RESULT"
          report_required_check "Test" "$TEST_RESULT"
          report_required_check "Build" "$BUILD_RESULT"
          report_required_check "Native Smoke" "$NATIVE_SMOKE_RESULT"

          if [ "$FORMAT_RESULT" != "success" ]; then
            failed=1
          fi

          if [ "$failed" -eq 0 ]; then
            echo "## Quality Gate: PASSED" >> "$GITHUB_STEP_SUMMARY"
            echo "All required checks completed successfully." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "## Quality Gate: FAILED" >> "$GITHUB_STEP_SUMMARY"
          echo "Some required checks have failed." >> "$GITHUB_STEP_SUMMARY"
          exit 1
