# Release Drafter only owns PR-label changelog grouping for draft note scaffolding.
# .github/workflows/release.yml owns tag validation, artifact builds, updater
# sidecars, provenance, and draft Release asset publication.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: "💥 Breaking Changes"
      labels: [breaking]
    - title: "🚀 Features"
      labels: [feature, enhancement]
    - title: "🐛 Bug Fixes"
      labels: [bug, fix]
    - title: "📚 Documentation"
      labels: [docs]
    - title: "📦 Dependencies"
      labels: [dependencies]
    - title: "🔧 Maintenance"
      labels: [chore, refactor]
    - title: "Other Changes"
      labels: ["*"]
