# Canonical label definitions for this repository.
# Automated labels are applied from .github/labeler.yml (areas/categories),
# .github/workflows/pr-insights-labeler.yml (risk/*, size/*, auto/*), and the
# issue templates (initial labels). This file defines every label's name,
# color, and description so the full set is reviewable in one place.
# Sync workflow is a follow-up; until then, keep this file in step with
# label changes made in the GitHub UI.
