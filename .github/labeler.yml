# Source of truth: this file owns area and release-category labels derived from paths or branch prefixes.
# PR Insights owns only risk/* and size/* labels.
frontend:
  - changed-files:
      - any-glob-to-any-file:
          - "src/**"
          - "index.html"
          - "vite.config.ts"
          - "tsconfig*.json"
          - "biome.json"

backend:
  - changed-files:
      - any-glob-to-any-file:
          - "src-tauri/**"

ui:
  - changed-files:
      - any-glob-to-any-file:
          - ".storybook/**"
          - "src/components/**"
          - "src/styles/**"

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"

category/tests:
  - changed-files:
      - any-glob-to-any-file:
          - "src/**/__tests__/**"
          - "src/**/*.test.ts"
          - "src/**/*.test.tsx"
          - "tests/**"
          - "e2e/**"
          - "playwright*.config.ts"

maintenance-family:
  - changed-files:
      - any-glob-to-any-file:
          - "scripts/**"
          - "mise.toml"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "pnpm-lock.yaml"
          - "package.json"
          - "src-tauri/Cargo.toml"
          - "src-tauri/Cargo.lock"

feature:
  - head-branch:
      - "^feat/"
      - "^feature/"

fix:
  - head-branch:
      - "^fix/"
      - "^bugfix/"

bug:
  - head-branch:
      - "^bug/"

breaking:
  - head-branch:
      - "^breaking/"

enhancement:
  - head-branch:
      - "^enhancement/"

chore:
  - head-branch:
      - "^chore/"

refactor:
  - head-branch:
      - "^refactor/"

i18n:
  - changed-files:
      - any-glob-to-any-file:
          - "src/locales/**"

release-readiness:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/release.yml"
          - ".github/workflows/release.yml"
          - "src-tauri/tauri.release.conf.json"
