# pnpm's own packageManager self-management is off because mise pins pnpm in
# mise.toml and CI resolves it through pnpm/setup. Leaving it on makes pnpm 12
# emit pnpm-lock.yaml as two YAML documents, which any consumer that reads only
# the first document reports as having no dependencies at all — GitHub's
# dependency graph and the Dependabot/SBOM tooling behind it work that way.
# That graph is currently disabled on this repository, so keeping the lockfile
# single-document is about not leaving a trap for whoever enables it.
pmOnFail: ignore
# GHSA-3jxr-9vmj-r5cp / GHSA-mh99-v99m-4gvg: minimatch 経由の brace-expansion 5.x を patched 版へ固定。
# minimatch の依存範囲 (^5.0.5) 内の patch bump で、upstream が追い付いたら削除する。
overrides:
  "brace-expansion@>=5.0.0 <5.0.8": ">=5.0.8"
  fast-uri: 3.1.4
allowBuilds:
  # Both postinstalls fetch the platform binary the tool is a wrapper for, so
  # denying them leaves @sentry/vite-plugin and wrangler unable to run at all.
  "@sentry/cli": true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  msw: true
  workerd: true
# Supply chain gate。値は pnpm 11 の built-in default と同じ 1440 分だが、明示する
# ことに意味がある。built-in default は後方互換のため minimumReleaseAgeStrict が
# false で、明示設定したときだけ strict が既定で有効になる。
# 非 strict のとき、範囲から選ぶ解決は cooldown を通る版へ下がるが、cooldown 内の
# 版を明示指定した install は失敗せず、その版を minimumReleaseAgeExclude へ自動追記
# して通る。この 2 つの挙動は別物として扱う。
# 実際に観測したのは後者で、cn@0.2.6 を明示指定した install が非 strict のため例外
# 追加で通った。strict にすると同じ操作が失敗するようになる。
# したがって運用は「24 時間待つ」か「その版を保留する」になる。どうしても必要な場合
# だけ、版を限定した例外を理由と owner と日付付きで審査して追加する。通常の失敗を
# 自動例外追加で回避する処理は新設しない。
# minimumReleaseAgeExcludePrune は add / update / remove 時に、lockfile が解決しなく
# なった除外 entry を掃除する (pnpm 11.22.0+)。過去の例外が正当だったかを判断する
# 機能ではない。
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeExcludePrune: true
# 供給網 gate。あるパッケージの trust level が過去に公開された版より低いとき install を
# 失敗させる。比較は semver でなく公開日順で、trusted-publisher から provenance や
# no-evidence へ落ちる遷移が「弱まった signal」にあたる。
# 除外は Dependency Advisory Policy と同じ扱いにする。匿名の除外は禁止で、対象・理由・
# 日付を quality-policy.md に記録する。
trustPolicy: no-downgrade
trustPolicyExclude:
  # semver@6.3.1: @babel/core と @babel/helper-compilation-targets 経由の transitive で、
  # `pnpm why semver --prod` はヒット 0 なので出荷 bundle に到達しない。Babel が semver の
  # 範囲を上げたらこの entry は不要になる。登録 2026-09-10。
  - semver@6.3.1
supportedArchitectures:
  os:
    - darwin
    - win32
    - linux
  cpu:
    - current
  libc:
    - current
    - glibc
