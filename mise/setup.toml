["setup:tauri:ubuntu"]
description = "Tauri アプリ開発に必要な Ubuntu/WSL システム依存をインストール"
run = "if command -v apt-get >/dev/null 2>&1 && [ -f /etc/debian_version ]; then sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf; else echo 'APT not available, skipping Tauri system deps'; fi"

# 候補の確認だけを行う read-only の入口。更新は deps:update が担う。
# ncu は npm registry の候補を出すだけで、GitHub Actions の pin は見ない。
# したがって deps:update の代替にはならず、範囲の違う別契約として並置する。
["deps:outdated"]
description = "同一 major 内の minor / patch 候補を確認する（何も変更しない）"
run = "ncu --target minor"

# latest は major だけでなく latest dist-tag への候補を出す。major 限定ではない。
["deps:outdated:latest"]
description = "major 更新を含む latest 候補を確認する（何も変更しない）"
run = "ncu --target latest"

# verify-action-pins は pnpm#13923 の代償制御。--include-github-actions は
# minimumReleaseAge を無視するため、Actions の pin だけが release-age の待機を
# 素通りする。SHA↔tag の照合と tag オブジェクト pin の検出でそれを補う。
# ネットワークと gh 認証を要するので lint / check / ci には入れない。
["deps:update"]
description = "Update npm deps and GitHub Actions pins, then verify pins and run the full gate"
run = """
pnpm update --include-github-actions
node ./scripts/verify-action-pins.ts
mise run ci
git status --short
"""
