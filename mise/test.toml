["test:ci"]
description = "Run CI tests with quieter unit test output, unit tests first"
run = """
mise run test:unit:ci
mise run test:rust
"""
run_windows = "mise run test:unit:ci && mise run test:rust"

["test:rust"]
description = "Run Rust tests; Windows CI is scoped to integration_test for native keyring/path coverage while Linux runs the full Rust suite"
run = "cargo test --manifest-path src-tauri/Cargo.toml"
run_windows = "cargo test --manifest-path src-tauri/Cargo.toml --target-dir src-tauri/target/test-rust --test integration_test"

["test:unit"]
description = "Run Vitest unit tests"
run = "vitest run --project node && vitest run --project jsdom"
run_windows = "vitest run"

["test:unit:fast"]
description = "Run fast Vitest unit tests without jsdom"
run = "vitest run --project node"

["test:unit:dom"]
description = "Run jsdom Vitest unit tests"
run = "vitest run --project jsdom"

["test:unit:ci"]
description = "Run Vitest unit tests with quieter CI output"
run = """
mise run test:unit:ci:node
mise run test:unit:ci:dom
"""
run_windows = "mise run test:unit:ci:node && mise run test:unit:ci:dom"

["test:unit:ci:node"]
description = "Run the Vitest node project with quieter CI output; split from test:unit:ci so CI can report its own step duration"
run = "vitest run --project node --reporter=dot --silent=passed-only"

["test:unit:ci:dom"]
description = "Run the Vitest jsdom project with quieter CI output; split from test:unit:ci so CI can report its own step duration"
run = "vitest run --project jsdom --reporter=dot --silent=passed-only"

["test:unit:ci:dom:shard1"]
description = "Run shard 1/2 of the Vitest jsdom project. CI runs this in its own job (parallel to shard2 and to the node+Rust job) so the jsdom per-file fixed cost is spread across independent runners instead of sequential steps in one job. Use with test:unit:ci:dom:shard2, whose union covers every jsdom file exactly once (see tests/release-repo-contract.node.test.ts for the pinned assertion)."
run = "vitest run --project jsdom --shard=1/2 --reporter=dot --silent=passed-only"

["test:unit:ci:dom:shard2"]
description = "Run shard 2/2 of the Vitest jsdom project; see test:unit:ci:dom:shard1 for the shard-pairing contract and the parallel-job rationale."
run = "vitest run --project jsdom --shard=2/2 --reporter=dot --silent=passed-only"

["test:unit:profile"]
description = "Run Vitest unit tests with verbose output for slow test profiling"
run = """
vitest run --project node --reporter=verbose --slow-test-threshold=300
vitest run --project jsdom --reporter=verbose --slow-test-threshold=300
"""
run_windows = "vitest run --project node --reporter=verbose --slow-test-threshold=300 && vitest run --project jsdom --reporter=verbose --slow-test-threshold=300"

["test:unit:parallel:profile"]
description = "Measure Vitest unit tests with node and jsdom projects in one Vitest invocation"
run = "vitest run --reporter=dot --silent=passed-only"

["test:e2e"]
description = "Run Playwright E2E tests"
run = "playwright test"

["test:storybook:e2e"]
description = "Run Storybook Playwright E2E tests"
run = "playwright test --config playwright.storybook.config.ts"

["test:all"]
description = "Run all tests including E2E"
depends = ["test:rust", "test:unit", "test:e2e", "test:storybook:e2e"]

["test:live"]
description = "Run FreshRSS live integration tests (requires .env with credentials)"
run = "dotenvx run -- cargo test --manifest-path src-tauri/Cargo.toml freshrss_live -- --ignored --nocapture"
