["format:biome"]
description = "Biome format + lint + import sort autofix"
run = "biome check --write --formatter-enabled=true --linter-enabled=true ."

["format:rust"]
description = "Rust format"
run = "cargo fmt --manifest-path src-tauri/Cargo.toml --all"

["format:toml"]
description = "TOML format"
run = "taplo fmt mise.toml mise/*.toml src-tauri/Cargo.toml"

["format:md"]
description = "Markdown format + lint autofix"
run = "markdownlint-cli2 $MD_GLOB $MD_EXCLUDE_NODE_MODULES $MD_EXCLUDE_PNPM_STORE $MD_EXCLUDE_WORKTREES $MD_EXCLUDE_TARGET $MD_EXCLUDE_TAURI_GEN --fix"
run_windows = "markdownlint-cli2 $env:MD_GLOB $env:MD_EXCLUDE_NODE_MODULES $env:MD_EXCLUDE_PNPM_STORE $env:MD_EXCLUDE_WORKTREES $env:MD_EXCLUDE_TARGET $env:MD_EXCLUDE_TAURI_GEN --fix"

["format:biome:check"]
description = "Biome format + lint check (no writes)"
run = "biome check --formatter-enabled=true --linter-enabled=true ."

["format:rust:check"]
description = "Rust format check (no writes)"
run = "cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check"

["format:toml:check"]
description = "TOML format check (no writes)"
run = "taplo fmt --check mise.toml mise/*.toml src-tauri/Cargo.toml"
