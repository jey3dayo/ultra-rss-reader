[package]
name = "ultra-rss-reader"
version = "0.60.0"
edition = "2021"
description = "A Tauri-based RSS reader"

[lib]
name = "ultra_rss_reader_lib"
crate-type = ["lib", "cdylib", "staticlib"]
doctest = false

[[bin]]
name = "ultra-rss-reader"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` is required for the embedded browser child webview boundary:
# `Window::add_child` creates the `browser-webview` webview and the runtime
# navigation/focus/close commands operate on that child webview in release
# builds. Remove this feature only after replacing those APIs with stable Tauri
# equivalents and release-smoke the browser preview open, resize, navigation,
# focus restore, and close flows.
tauri = { version = "2", features = ["image-png", "unstable"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = { version = "2", features = ["tracing"] }
tauri-plugin-mcp-bridge = { version = "0.11", optional = true }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["brotli", "gzip", "json"] }
feed-rs = "2"
ammonia = "4.1.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
] }
async-trait = "0.1"
thiserror = "2"
quick-xml = "0.41"
kuchikiki = "0.8.8-speedreader"
open = "5.4"
futures = "0.3.32"
sys-locale = "0.3"
unicode-normalization = "0.1"
tauri-plugin-dialog = "2"

[features]
# Debug-only MCP bridge plugin (see `run()` in src/lib.rs). Not part of the
# default feature set so the release dependency graph and binary never link
# `tauri-plugin-mcp-bridge`. Local dev entry points enable it explicitly via
# `tauri dev -f mcp-bridge` (see mise.toml `app:dev*` tasks).
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "NSEvent",
] }
objc2-web-kit = "0.3.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61.2", features = [
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.2"
# Restores only the main window size and maximized state. Position and
# fullscreen restore stay disabled so a saved geometry can never place the
# window on a disconnected monitor or at negative coordinates; the window
# always uses Tauri's visible-display center. Saved sizes are physical pixels,
# so `clamp_main_window_size_after_state_restore` re-clamps them against the
# current monitor before the window is shown.
tauri-plugin-window-state = "2"

[dev-dependencies]
flate2 = "1"
mockito = "1"
tempfile = "3"
