# ========================================
# グローバル設定
# ========================================

[env]
_.path = ["./node_modules/.bin"]

# Markdown lint/format
MD_GLOB = "**/*.md"
MD_EXCLUDE_NODE_MODULES = "#**/node_modules/**"
MD_EXCLUDE_WORKTREES = "#**/.worktrees/**"
MD_EXCLUDE_TARGET = "#**/target/**"
MD_EXCLUDE_TAURI_GEN = "#src-tauri/gen/**"

[tools]
node = "24"
rust = "stable"
taplo = "latest"
rtk = "latest"
actionlint = "latest"
shellcheck = "latest"
"pipx:yamllint" = "latest"
"npm:pnpm" = "10.33.4"

# ========================================
# フォーマット（自動修正）
# ========================================

[tasks.format]
description = "Format all (TS + Rust + TOML)"
depends = ["format:biome", "format:rust", "format:toml", "format:md"]

[tasks."format:biome"]
description = "Biome format + lint + import sort autofix"
run = "biome check --write --formatter-enabled=true --linter-enabled=true ."
run_windows = "biome.CMD check --write --formatter-enabled=true --linter-enabled=true ."

[tasks."format:rust"]
description = "Rust format"
run = "cargo fmt --manifest-path src-tauri/Cargo.toml --all"

[tasks."format:toml"]
description = "TOML format"
run = "taplo fmt mise.toml src-tauri/Cargo.toml"

[tasks."format:md"]
description = "Markdown format + lint autofix"
run = "pnpm markdownlint-cli2 $MD_GLOB $MD_EXCLUDE_NODE_MODULES $MD_EXCLUDE_WORKTREES $MD_EXCLUDE_TARGET $MD_EXCLUDE_TAURI_GEN --fix"
run_windows = "markdownlint-cli2.CMD %MD_GLOB% %MD_EXCLUDE_NODE_MODULES% %MD_EXCLUDE_WORKTREES% %MD_EXCLUDE_TARGET% %MD_EXCLUDE_TAURI_GEN% --fix"

# ========================================
# フォーマットチェック（書き込みなし、CI用）
# ========================================

[tasks."format:check"]
description = "Format check all (no writes)"
depends = [
  "format:biome:check",
  "format:rust:check",
  "format:toml:check",
  "lint:md",
]

[tasks."format:biome:check"]
description = "Biome format + lint check (no writes)"
run = "rtk err biome check --formatter-enabled=true --linter-enabled=true ."
run_windows = "biome.CMD check --formatter-enabled=true --linter-enabled=true ."

[tasks."format:rust:check"]
description = "Rust format check (no writes)"
run = "rtk err cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check"
run_windows = "cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check"

[tasks."format:toml:check"]
description = "TOML format check (no writes)"
run = "rtk err taplo fmt --check mise.toml src-tauri/Cargo.toml"
run_windows = "taplo fmt --check mise.toml src-tauri/Cargo.toml"

# ========================================
# リント
# ========================================

[tasks.lint]
description = "All lint checks"
depends = [
  "lint:types",
  "lint:biome",
  "lint:clippy",
  "lint:md",
  "lint:yaml",
  "lint:actions",
  "lint:actions-shell",
  "lint:workflow-pins",
]

[tasks."lint:types"]
description = "TypeScript type check"
run = "rtk pnpm exec tsc --noEmit"
run_windows = "tsc.CMD --noEmit"

[tasks."lint:biome"]
description = "Biome lint check"
run = "rtk pnpm run lint"
run_windows = "biome.CMD lint ."

[tasks."lint:clippy"]
description = "Rust clippy for dev and release profiles"
run = """
rtk err cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
rtk err cargo clippy --release --manifest-path src-tauri/Cargo.toml -- -D warnings
"""
run_windows = "cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings && cargo clippy --release --manifest-path src-tauri/Cargo.toml -- -D warnings"

[tasks."lint:md"]
description = "Markdown lint check"
run = "pnpm markdownlint-cli2 $MD_GLOB $MD_EXCLUDE_NODE_MODULES $MD_EXCLUDE_WORKTREES $MD_EXCLUDE_TARGET $MD_EXCLUDE_TAURI_GEN"
run_windows = "markdownlint-cli2.CMD %MD_GLOB% %MD_EXCLUDE_NODE_MODULES% %MD_EXCLUDE_WORKTREES% %MD_EXCLUDE_TARGET% %MD_EXCLUDE_TAURI_GEN%"

[tasks."lint:yaml"]
description = "YAML lint check"
run = "yamllint -c .yamllint .github/ .yamllint pnpm-workspace.yaml"

[tasks."lint:actions"]
description = "GitHub Actions workflow check (actionlint)"
run = "actionlint -shellcheck="

[tasks."lint:actions-shell"]
description = "GitHub Actions shell script check (actionlint with shellcheck)"
run = "actionlint"

[tasks."lint:workflow-pins"]
description = "Workflow action references must be pinned to commit SHAs"
run = "node scripts/check-workflow-pins.mjs"

[tasks."audit:deps"]
description = "Manual dependency security audit; not part of CI or release preflight until advisory policy is defined"
run = "pnpm audit --audit-level high"
run_windows = "pnpm.CMD audit --audit-level high"

[tasks."quality:toolchain"]
description = "Check Node, pnpm, and mise toolchain version contract"
run = """
node --input-type=module <<'NODE'
import { readFileSync } from "node:fs";

const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
const miseToml = readFileSync("mise.toml", "utf8");

const expectedNode = packageJson.engines?.node;
const expectedPnpm = packageJson.engines?.pnpm;
const packageManagerPnpm = packageJson.packageManager?.match(/^pnpm@(.+)$/)?.[1];
const miseNode = miseToml.match(/^node = "([^"]+)"$/m)?.[1];
const misePnpm = miseToml.match(/^"npm:pnpm" = "([^"]+)"$/m)?.[1];

const failures = [];
if (!expectedNode || !expectedPnpm || !packageManagerPnpm) {
  failures.push("package.json must define engines.node, engines.pnpm, and packageManager pnpm@version");
}
if (expectedNode !== miseNode) {
  failures.push(`Node version drift: package.json engines.node=${expectedNode} mise.toml tools.node=${miseNode}`);
}
if (expectedPnpm !== packageManagerPnpm || expectedPnpm !== misePnpm) {
  failures.push(
    `pnpm version drift: engines.pnpm=${expectedPnpm} packageManager=${packageManagerPnpm} mise.toml=${misePnpm}`,
  );
}

if (failures.length > 0) {
  console.error(failures.join("\\n"));
  process.exit(1);
}

console.log(`toolchain contract ok: node ${expectedNode}, pnpm ${expectedPnpm}`);
NODE
"""
run_windows = """
node --input-type=module -e "import { readFileSync } from 'node:fs'; const packageJson = JSON.parse(readFileSync('package.json', 'utf8')); const miseToml = readFileSync('mise.toml', 'utf8'); const expectedNode = packageJson.engines?.node; const expectedPnpm = packageJson.engines?.pnpm; const packageManagerPnpm = packageJson.packageManager?.match(/^pnpm@(.+)$/)?.[1]; const miseNode = miseToml.match(/^node = \"([^\"]+)\"$/m)?.[1]; const misePnpm = miseToml.match(/^\"npm:pnpm\" = \"([^\"]+)\"$/m)?.[1]; const failures = []; if (!expectedNode || !expectedPnpm || !packageManagerPnpm) failures.push('package.json must define engines.node, engines.pnpm, and packageManager pnpm@version'); if (expectedNode !== miseNode) failures.push(`Node version drift: package.json engines.node=${expectedNode} mise.toml tools.node=${miseNode}`); if (expectedPnpm !== packageManagerPnpm || expectedPnpm !== misePnpm) failures.push(`pnpm version drift: engines.pnpm=${expectedPnpm} packageManager=${packageManagerPnpm} mise.toml=${misePnpm}`); if (failures.length) { console.error(failures.join('\\n')); process.exit(1); } console.log(`toolchain contract ok: node ${expectedNode}, pnpm ${expectedPnpm}`);"
"""

[tasks."quality:markdownlint-contract"]
description = "Check markdownlint glob and ignore pattern contract"
run = "pnpm markdownlint-cli2 $MD_GLOB $MD_EXCLUDE_NODE_MODULES $MD_EXCLUDE_WORKTREES $MD_EXCLUDE_TARGET $MD_EXCLUDE_TAURI_GEN"
run_windows = "markdownlint-cli2.CMD %MD_GLOB% %MD_EXCLUDE_NODE_MODULES% %MD_EXCLUDE_WORKTREES% %MD_EXCLUDE_TARGET% %MD_EXCLUDE_TAURI_GEN%"

[tasks."report:licenses"]
description = "Generate pnpm and Cargo dependency license inventory reports under tmp/dependency-licenses"
run = "node ./scripts/report-dependency-licenses.ts"
run_windows = "node ./scripts/report-dependency-licenses.ts"

# ========================================
# ローカル品質ゲート / レポート
# ========================================

[tasks."quality:react-doctor:diff"]
description = "React Doctor diff regression gate; pinned tool and baseline"
run = "pnpm run quality:react-doctor:diff"
run_windows = "pnpm.CMD run quality:react-doctor:diff"

[tasks."quality:react-doctor:full"]
description = "React Doctor full scan report; pinned tool and informational baseline"
run = "pnpm run quality:react-doctor:full"
run_windows = "pnpm.CMD run quality:react-doctor:full"

[tasks."quality:knip"]
description = "Knip baseline drift gate; pinned tool and issue count"
run = "pnpm run quality:knip"
run_windows = "pnpm.CMD run quality:knip"

[tasks."report:similarity"]
description = "Similarity scan report with TODO false-positive baseline"
run = "pnpm run report:similarity"
run_windows = "pnpm.CMD run report:similarity"

# ========================================
# テスト
# ========================================

[tasks.test]
description = "Run all tests"
depends = ["test:rust", "test:unit"]

[tasks."test:ci"]
description = "Run CI tests with quieter unit test output, unit tests first"
run = """
mise run test:unit:ci
mise run test:rust
"""
run_windows = "mise run test:unit:ci && mise run test:rust"

[tasks."test:rust"]
description = "Run Rust tests; Windows CI is scoped to integration_test for native keyring/path coverage while Linux runs the full Rust suite"
run = "rtk test cargo test --manifest-path src-tauri/Cargo.toml"
run_windows = "cargo test --manifest-path src-tauri/Cargo.toml --target-dir src-tauri/target/test-rust --test integration_test"

[tasks."test:unit"]
description = "Run Vitest unit tests"
run = "rtk test pnpm run test"
run_windows = "vitest.CMD run"

[tasks."test:unit:fast"]
description = "Run fast Vitest unit tests without jsdom"
run = "rtk test pnpm run test:node"
run_windows = "pnpm.CMD run test:node"

[tasks."test:unit:dom"]
description = "Run jsdom Vitest unit tests"
run = "rtk test pnpm run test:jsdom"
run_windows = "pnpm.CMD run test:jsdom"

[tasks."test:unit:ci"]
description = "Run Vitest unit tests with quieter CI output"
run = """
rtk test pnpm run test:node --reporter=dot --silent=passed-only
rtk test pnpm run test:jsdom --reporter=dot --silent=passed-only
"""
run_windows = "pnpm.CMD run test:node --reporter=dot --silent=passed-only && pnpm.CMD run test:jsdom --reporter=dot --silent=passed-only"

[tasks."test:unit:profile"]
description = "Run Vitest unit tests with verbose output for slow test profiling"
run = """
rtk test pnpm run test:node --reporter=verbose --slow-test-threshold=300
rtk test pnpm run test:jsdom --reporter=verbose --slow-test-threshold=300
"""
run_windows = "pnpm.CMD run test:node --reporter=verbose --slow-test-threshold=300 && pnpm.CMD run test:jsdom --reporter=verbose --slow-test-threshold=300"

[tasks."test:unit:parallel:profile"]
description = "Measure Vitest unit tests with node and jsdom projects in one Vitest invocation"
run = "rtk test pnpm exec vitest run --reporter=dot --silent=passed-only"
run_windows = "pnpm.CMD exec vitest run --reporter=dot --silent=passed-only"

[tasks."test:e2e"]
description = "Run Playwright E2E tests"
run = "rtk test pnpm exec playwright test"
run_windows = "playwright.CMD test"

[tasks."test:storybook:e2e"]
description = "Run Storybook Playwright E2E tests"
run = "rtk test pnpm run test:storybook:e2e"
run_windows = "pnpm.CMD run test:storybook:e2e"

[tasks."test:all"]
description = "Run all tests including E2E"
depends = ["test:rust", "test:unit", "test:e2e", "test:storybook:e2e"]

[tasks."test:live"]
description = "Run FreshRSS live integration tests (requires .env with credentials)"
run = "dotenvx run -- rtk test cargo test --manifest-path src-tauri/Cargo.toml freshrss_live -- --ignored --nocapture"

# ========================================
# ビルド
# ========================================

[tasks.build]
description = "Build frontend"
run = ["pnpm build"]
run_windows = "tsc.CMD && vite.CMD build"

[tasks."build:storybook"]
description = "Build Storybook"
run = "pnpm run build-storybook"
run_windows = "pnpm.CMD run build-storybook"

# ========================================
# アプリ（Tauri）
# ========================================

[tasks."app:dev"]
description = "Run native app in dev mode"
env = { DEV_CREDENTIALS = "1" }
run = "node ./scripts/tauri-cli-dispatch.ts dev -c src-tauri/tauri.dev.conf.json"

[tasks."app:dev:native-keyring"]
description = "Run native app in dev mode with the OS keyring backend"
run = "node ./scripts/tauri-cli-dispatch.ts dev -c src-tauri/tauri.dev.conf.json"

[tasks."app:dev:subscriptions-index"]
description = "Run native app in dev mode and jump into the subscriptions index workspace"
env = { DEV_CREDENTIALS = "1", VITE_DEV_INTENT = "open-subscriptions-index" }
run = "node ./scripts/tauri-cli-dispatch.ts dev -c src-tauri/tauri.dev.conf.json"

[tasks."app:dev:web-preview"]
description = "Run native app in dev mode and open VITE_DEV_WEB_URL directly in Web Preview (optionally sized by VITE_DEV_WINDOW_WIDTH/HEIGHT)"
env = { DEV_CREDENTIALS = "1", VITE_DEV_INTENT = "open-web-preview-url" }
run = "node ./scripts/tauri-cli-dispatch.ts dev -c src-tauri/tauri.dev.conf.json"

[tasks."app:dev:seed-from-prod"]
description = "Seed the Dev app database from the packaged app data database"
run = "node ./scripts/seed-dev-db-from-prod.ts"

[tasks."app:dev:signed"]
description = "Build, codesign, and run native app on macOS (no Keychain dialog)"
run = """
pnpm dev &
DEV_PID=$!
cargo build --manifest-path src-tauri/Cargo.toml
codesign -s "UltraRSSReader-Dev" -f src-tauri/target/debug/ultra-rss-reader
src-tauri/target/debug/ultra-rss-reader
kill $DEV_PID 2>/dev/null || true
"""
run_windows = "echo app:dev:signed is macOS-only (requires codesign and Unix shell tooling). && exit /b 1"

[tasks."app:dev:browser"]
description = "Run frontend dev server for browser UI testing"
run = "pnpm dev --host 127.0.0.1 --port 4173 --strictPort"

[tasks."app:dev:vite-check"]
description = "Check that the Tauri Vite dev port is available"
run = "node ./scripts/tauri-dev-vite-manager.ts --check"
run_windows = "node ./scripts/tauri-dev-vite-manager.ts --check"

[tasks."app:build"]
description = "Build native app for current platform (.app/.dmg on macOS, .msi/.exe on Windows)"
run = "node ./scripts/tauri-cli-dispatch.ts build"
run_windows = "node ./scripts/tauri-cli-dispatch.ts build"

[tasks."app:install"]
description = "Build, locally re-sign, and install the current checkout; not a published release artifact verification"
depends = ["app:build"]
run = """
APP_SRC="src-tauri/target/release/bundle/macos/Ultra RSS Reader.app"
APP_DST="/Applications/Ultra RSS Reader.app"
if [ ! -d "$APP_SRC" ]; then
  echo "Error: $APP_SRC not found" >&2
  exit 1
fi
rm -rf "$APP_DST"
cp -R "$APP_SRC" "$APP_DST"
xattr -cr "$APP_DST"
codesign --force --deep --sign - "$APP_DST"
open "$APP_DST"
"""
run_windows = """
$exe = Get-ChildItem 'src-tauri\\target\\release\\bundle\\nsis\\*.exe' -ErrorAction SilentlyContinue |
  Sort-Object LastWriteTime -Descending |
  Select-Object -First 1
if ($exe) {
  $process = Start-Process -FilePath $exe.FullName -ArgumentList '/S' -Wait -PassThru
  exit $process.ExitCode
}
$msi = Get-ChildItem 'src-tauri\\target\\release\\bundle\\msi\\*.msi' -ErrorAction SilentlyContinue |
  Sort-Object LastWriteTime -Descending |
  Select-Object -First 1
if ($msi) {
  $process = Start-Process msiexec.exe -ArgumentList @('/i', $msi.FullName, '/qn', '/norestart') -Wait -PassThru
  exit $process.ExitCode
}
Write-Error 'No Windows installer found under src-tauri\\target\\release\\bundle.'
exit 1
"""

[tasks."app:build:debug"]
description = "Build native app in debug mode (faster, no optimizations)"
run = "node ./scripts/tauri-cli-dispatch.ts build --debug"
run_windows = "node ./scripts/tauri-cli-dispatch.ts build --debug"

[tasks."app:icon"]
description = "Generate app icons from source image"
run = "pnpm exec tauri icon"

# ========================================
# エイリアス（まとめ実行）
# ========================================

[tasks.check]
description = "Fast local verification (format + lint + Rust tests + node Vitest)"
depends = ["format", "lint", "test:rust", "test:unit:fast"]

[tasks.ci]
description = "CI equivalent, unit-first full gate (format:check + test:unit:ci + lint + test:rust + build)"
run = """
mise run format:check
mise run test:unit:ci
mise run lint
mise run test:rust
mise run build
"""
run_windows = "mise run format:check && mise run test:unit:ci && mise run lint && mise run test:rust && mise run build"
