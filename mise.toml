# ========================================
# グローバル設定
# ========================================

[env]
_.path = ["./node_modules/.bin"]

# Markdown lint/format
MD_GLOB = "**/*.md"
MD_EXCLUDE_NODE_MODULES = "#**/node_modules/**"
MD_EXCLUDE_PNPM_STORE = "#**/.pnpm-store/**"
MD_EXCLUDE_WORKTREES = "#**/.worktrees/**"
MD_EXCLUDE_TARGET = "#**/target/**"
MD_EXCLUDE_TAURI_GEN = "#src-tauri/gen/**"

[tools]
node = "26.4.0"
rust = "stable"
taplo = "latest"
actionlint = "latest"
shellcheck = "latest"
uv = "latest"
"pipx:yamllint" = "latest"
"npm:npm-check-updates" = "22.2.9"

[settings]
windows_default_inline_shell_args = "pwsh -Command"
windows_default_file_shell_args = "pwsh -Command"

[task_config]
includes = [
  "mise/format.toml",
  "mise/lint.toml",
  "mise/quality.toml",
  "mise/test.toml",
  "mise/setup.toml",
]

# ========================================
# フォーマット（自動修正）
# ========================================

[tasks.format]
description = "Format all (TS + Rust + TOML)"
depends = ["format:biome", "format:rust", "format:toml", "format:md"]

# ========================================
# フォーマットチェック（書き込みなし、CI用）
# ========================================

[tasks."format:check"]
description = "Format check all (no writes)"
depends = [
  "format:biome:check",
  "format:rust:check",
  "format:toml:check",
  "lint:md",
]

# ========================================
# リント
# ========================================

[tasks.lint]
description = "All lint checks"
depends = [
  "lint:types",
  "lint:biome",
  "lint:clippy",
  "lint:md",
  "lint:yaml",
  "lint:actions",
  "lint:actions-shell",
  "lint:workflow-pins",
]

# ========================================
# ローカル品質ゲート / レポート
# ========================================

# ========================================
# テスト
# ========================================

[tasks.test]
description = "Run all tests"
depends = ["test:rust", "test:unit"]

# ========================================
# ビルド
# ========================================

[tasks.build]
description = "Build frontend"
run = ["tsc6 && vite build"]

[tasks."build:storybook"]
description = "Build Storybook"
run = "storybook build"

# ========================================
# アプリ（Tauri）
# ========================================

[tasks."app:dev"]
description = "Run native app in dev mode"
env = { DEV_CREDENTIALS = "1" }
run = "node ./scripts/tauri-cli-dispatch.ts dev -c src-tauri/tauri.dev.conf.json"

[tasks."app:dev:native-keyring"]
description = "Run native app in dev mode with the OS keyring backend"
run = "node ./scripts/tauri-cli-dispatch.ts dev -c src-tauri/tauri.dev.conf.json"

[tasks."app:dev:subscriptions-index"]
description = "Run native app in dev mode and jump into the subscriptions index workspace"
env = { DEV_CREDENTIALS = "1", VITE_DEV_INTENT = "open-subscriptions-index" }
run = "node ./scripts/tauri-cli-dispatch.ts dev -c src-tauri/tauri.dev.conf.json"

[tasks."app:dev:web-preview"]
description = "Run native app in dev mode and open VITE_DEV_WEB_URL directly in Web Preview (optionally sized by VITE_DEV_WINDOW_WIDTH/HEIGHT)"
env = { DEV_CREDENTIALS = "1", VITE_DEV_INTENT = "open-web-preview-url" }
run = "node ./scripts/tauri-cli-dispatch.ts dev -c src-tauri/tauri.dev.conf.json"

[tasks."app:dev:seed-from-prod"]
description = "Seed the Dev app database from the packaged app data database"
run = "node ./scripts/seed-dev-db-from-prod.ts"

[tasks."app:dev:signed"]
description = "Build, codesign, and run native app on macOS (no Keychain dialog)"
run = """
vite &
DEV_PID=$!
cargo build --manifest-path src-tauri/Cargo.toml
codesign -s "UltraRSSReader-Dev" -f src-tauri/target/debug/ultra-rss-reader
src-tauri/target/debug/ultra-rss-reader
kill $DEV_PID 2>/dev/null || true
"""
run_windows = "echo 'app:dev:signed is macOS-only (requires codesign and Unix shell tooling).'; exit 1"

[tasks."app:dev:browser"]
description = "Run frontend dev server for browser UI testing"
run = "vite --host 127.0.0.1 --port 4173 --strictPort"

[tasks."app:dev:vite-check"]
description = "Check that the Tauri Vite dev port is available"
run = "node ./scripts/tauri-dev-vite-manager.ts --check"

[tasks."app:build"]
description = "Build native app for current platform (.app/.dmg on macOS, .msi/.exe on Windows)"
run = "node ./scripts/tauri-cli-dispatch.ts build"

[tasks."app:install"]
description = "Build, locally re-sign, and install the current checkout; not a published release artifact verification"
depends = ["app:build"]
run = """
APP_SRC="src-tauri/target/release/bundle/macos/Ultra RSS Reader.app"
APP_DST="/Applications/Ultra RSS Reader.app"
if [ ! -d "$APP_SRC" ]; then
  echo "Error: $APP_SRC not found" >&2
  exit 1
fi
rm -rf "$APP_DST"
cp -R "$APP_SRC" "$APP_DST"
xattr -cr "$APP_DST"
codesign --force --deep --sign - "$APP_DST"
open "$APP_DST"
"""
run_windows = "node ./scripts/install-windows-app.ts"

[tasks."app:build:debug"]
description = "Build native app in debug mode (faster, no optimizations)"
run = "node ./scripts/tauri-cli-dispatch.ts build --debug"

[tasks."app:icon"]
description = "Generate app icons from source image"
run = "tauri icon assets/app-icon-tauri-source.png"

[tasks."app:icon:liquid"]
description = "Regenerate the macOS Liquid Glass app icon asset catalog"
run = """
set -eu

if [ "$(uname)" != "Darwin" ]; then
  echo "app:icon:liquid is macOS-only (requires Xcode actool and sips)." >&2
  exit 1
fi

mkdir -p tmp
ICON_TMP_DIR="$(mktemp -d tmp/app-icon-liquid.XXXXXX)"
case "$ICON_TMP_DIR" in
  tmp/app-icon-liquid.*) ;;
  *)
    echo "Refusing to remove an unexpected temporary directory: $ICON_TMP_DIR" >&2
    exit 1
    ;;
esac
trap 'rm -rf "$ICON_TMP_DIR"' EXIT

mkdir -p src-tauri/icons/AppIcon.icon/Assets
sips --resampleHeightWidth 1024 1024 assets/app-icon-liquid-foreground.png \
  --out src-tauri/icons/AppIcon.icon/Assets/foreground.png

xcrun actool src-tauri/icons/AppIcon.icon \
  --compile "$ICON_TMP_DIR" \
  --output-format human-readable-text \
  --notices \
  --warnings \
  --output-partial-info-plist "$ICON_TMP_DIR/assetcatalog_generated_info.plist" \
  --app-icon AppIcon \
  --include-all-app-icons \
  --accent-color AccentColor \
  --enable-on-demand-resources NO \
  --development-region en \
  --target-device mac \
  --minimum-deployment-target 26.0 \
  --platform macosx

test -f "$ICON_TMP_DIR/Assets.car"
test "$(plutil -extract CFBundleIconName raw "$ICON_TMP_DIR/assetcatalog_generated_info.plist")" = "AppIcon"
cp "$ICON_TMP_DIR/Assets.car" src-tauri/icons/Assets.car
"""
run_windows = "echo 'app:icon:liquid is macOS-only (requires Xcode actool and sips).'; exit 1"

# ========================================
# エイリアス（まとめ実行）
# ========================================

[tasks.check]
description = "Fast local verification (format + lint + Rust tests + node Vitest)"
depends = ["format", "lint", "test:rust", "test:unit:fast"]

[tasks."check:wsl"]
description = "WSL-backed static-analysis gate; Windows delegates to WSL_REPO_DIR"
run = [
  { task = "format:check" },
  { task = "lint:types" },
  { task = "lint:yaml" },
  { task = "lint:actions" },
  { task = "lint:actions-shell" },
  { task = "lint:workflow-pins" },
]
run_windows = "pwsh -NoProfile -File scripts/run-wsl-mise-task.ps1 check:wsl"

[tasks."release:preflight:local"]
description = "Pre-push release preflight mirror; set RELEASE_TAG=vX.Y.Z after creating the local annotated tag"
run = """
: "${RELEASE_TAG:?set RELEASE_TAG=vX.Y.Z}"
mise exec -- node ./scripts/release/validate-version-parity.ts
mise exec -- pnpm run check:release-contamination
mise exec -- mise run format:check
mise exec -- mise run lint:types
mise exec -- mise run test:unit:ci
"""
run_windows = """
$ErrorActionPreference = 'Stop'
if (-not $env:RELEASE_TAG) { throw 'set RELEASE_TAG=vX.Y.Z' }
mise exec -- node ./scripts/release/validate-version-parity.ts
mise exec -- pnpm run check:release-contamination
mise exec -- mise run format:check
mise exec -- mise run lint:types
mise exec -- mise run test:unit:ci
"""

[tasks.ci]
description = "CI equivalent, unit-first full gate (format:check + test:unit:ci + lint + test:rust + build)"
run = """
mise run format:check
mise run test:unit:ci
mise run lint
mise run test:rust
mise run build
"""
run_windows = "mise run format:check && mise run test:unit:ci && mise run lint && mise run test:rust && mise run build"
