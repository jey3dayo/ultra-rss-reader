pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: pnpm exec biome check --write --formatter-enabled=true --linter-enabled=true --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: markdown
      glob: "*.md"
      run: pnpm exec markdownlint-cli2 --fix {staged_files}
      stage_fixed: true
    - name: yaml
      glob: "*.{yml,yaml}"
      run: yamllint -c .yamllint {staged_files}
    - name: actions
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint -shellcheck= {staged_files}
    - name: workflow-pins
      glob: ".github/workflows/*.{yml,yaml}"
      run: node scripts/check-workflow-pins.mjs
    - name: toml
      glob: "*.toml"
      run: taplo fmt {staged_files}
      stage_fixed: true
    - name: rustfmt
      glob: "*.rs"
      run: rustfmt {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    # glob は各 mise タスクの実際の入力に合わせる（biome/rustfmt/taplo/markdownlint の走査対象）
    - name: format:check
      glob: "*.{ts,tsx,js,jsx,mjs,json,jsonc,css,rs,toml,md}"
      run: mise run format:check
    - name: test:unit:ci
      glob:
        - "*.{ts,tsx,js,jsx,mjs,json,jsonc}"
        - "pnpm-lock.yaml"
      run: mise run test:unit:ci
    # lint は tsc/biome/clippy/markdownlint/yamllint/actionlint/workflow-pins を含むため広め
    - name: lint
      glob: "*.{ts,tsx,js,jsx,mjs,json,jsonc,css,rs,toml,md,yml,yaml}"
      run: mise run lint
    - name: test:rust
      glob:
        - "*.rs"
        - "src-tauri/**/*.toml"
        - "src-tauri/Cargo.lock"
      run: mise run test:rust
    - name: build
      glob:
        - "*.{ts,tsx,js,jsx,mjs,json,jsonc,css,html}"
        - "pnpm-lock.yaml"
      run: mise run build
